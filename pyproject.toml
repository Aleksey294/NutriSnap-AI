[project]
name = "nutrisnap"
version = "0.1.0"
description = "Лёгкий Telegram-дневник питания с OpenRouter"
requires-python = ">=3.12,<3.14"
dependencies = [
  "aiogram>=3.20,<4", "aiosqlite>=0.21,<1", "httpx>=0.28,<1",
  "pydantic-settings>=2.9,<3", "pillow>=11.2,<13", "pyzbar>=0.1.9,<0.2", "tzdata>=2025.2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
