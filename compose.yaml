services:
  bot:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/nutrisnap.db
    volumes:
      - bot_data:/app/data
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'
    healthcheck:
      test: [CMD, python, -m, nutrisnap.healthcheck]
      interval: 60s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  bot_data:
